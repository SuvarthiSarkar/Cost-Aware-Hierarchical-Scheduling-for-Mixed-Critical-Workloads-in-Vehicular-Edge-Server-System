# ═══════════════════════════════════════════════════════════
# Server Heterogeneity Configuration
# Each BS samples parameters uniformly from [LO, HI]
# P_max is derived as P_idle + alpha (always well-separated)
# ═══════════════════════════════════════════════════════════

# Static (idle) power in Watts — U[P_IDLE_LO, P_IDLE_HI]
P_IDLE_LO = 15
P_IDLE_HI = 200

# Dynamic power coefficient alpha — U[ALPHA_LO, ALPHA_HI]
# Power model: P(u) = P_idle + alpha * u^3
# P_max = P_idle + alpha
ALPHA_LO = 50
ALPHA_HI = 350

# Physical BS capacity (U_max)
# Effective scheduling cap = MAX_UTIL (config.txt) × U_max
UMAX_LO = 0.80
UMAX_HI = 0.95

# Random seed for reproducibility (change to get different server configs)
SERVER_SEED = 12345
